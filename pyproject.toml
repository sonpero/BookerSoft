[project]
name = "bookersoft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexandre DANIEL", email = "alexandre.daniel.ext@sodexo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]

[project.scripts]
bookersoft-users = "bookersoft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
