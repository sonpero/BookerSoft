<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BookerSoft</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
<h1>BookerSoft</h1>
</header>

<main>
<section id="upload-section">
<h2>Upload</h2>
<form id="upload-form">
<input type="file" id="file-input" multiple accept=".epub,.pdf" />
<button type="submit">Upload</button>
</form>
<ul id="upload-errors" class="errors" hidden></ul>
</section>

<section id="library-section">
<h2>Library</h2>
<div id="filter-bar">
<input type="search" id="search-input" placeholder="Search by title or author" aria-label="Search" />
<label>
Format
<select id="format-filter">
<option value="">All</option>
<option value="epub">EPUB</option>
<option value="pdf">PDF</option>
</select>
</label>
<label>
Min. rating
<select id="min-rating-filter">
<option value="">Any</option>
<option value="1">1+</option>
<option value="2">2+</option>
<option value="3">3+</option>
<option value="4">4+</option>
<option value="5">5</option>
</select>
</label>
<label>
Uploaded by
<select id="uploader-filter">
<option value="">Everyone</option>
</select>
</label>
<label id="attention-filter-label">
<input type="checkbox" id="attention-filter" />
Needs attention only
</label>
<label>
Sort by
<select id="sort-select">
<option value="recent">Recently added</option>
<option value="title">Title</option>
<option value="author">Author</option>
<option value="rating">Average rating</option>
</select>
</label>
<button type="button" id="clear-filters-button" hidden>Clear filters</button>
</div>
<p id="empty-state" hidden>No books yet. Upload one above to get started.</p>
<p id="no-match-state" hidden>No book matches these filters.</p>
<table id="book-table" hidden>
<thead>
<tr>
<th></th>
<th>Title</th>
<th>Format</th>
<th>Size</th>
<th>Uploaded</th>
<th>Rating</th>
<th></th>
<th></th>
</tr>
</thead>
<tbody id="book-list"></tbody>
</table>
</section>

<section id="detail-section" hidden>
<a href="/" id="back-to-library">&larr; Library</a>
<p id="detail-not-found" hidden>Book not found.</p>
<div id="detail-content" hidden>
<div id="detail-cover"></div>
<div id="detail-info">
<h2 id="detail-title"></h2>
<p id="detail-author"></p>
<p id="detail-rating-summary"></p>
<p id="detail-attention" class="attention-banner" hidden></p>
<div class="detail-actions">
<a id="detail-download" href="#">Download</a>
<button id="detail-reextract" type="button">Re-extract metadata</button>
<button id="detail-delete" type="button">Delete</button>
</div>
<dl id="detail-fields"></dl>
</div>
</div>

<section id="reviews-section" hidden>
<h3>Ratings &amp; reviews</h3>
<form id="review-form">
<label>
Your rating
<select id="review-rating-input" required>
<option value="">Select a rating</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
</select>
</label>
<label>
Your review (optional)
<textarea id="review-text-input" rows="3"></textarea>
</label>
<button type="submit">Save rating &amp; review</button>
<button id="review-delete-button" type="button" hidden>Delete my review</button>
</form>
<p id="reviews-empty-state" hidden>No reviews yet.</p>
<ul id="reviews-list"></ul>
</section>
</section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
